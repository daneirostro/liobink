<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primero</title>
<style>
  :root{
    --glass: rgba(20, 26, 22, 0.55);
    --glass-border: rgba(255, 255, 255, 0.14);
    --text-main: #f5f2ea;
    --text-soft: rgba(245, 242, 234, 0.72);
    --accent: #e0a840;
    --accent-soft: rgba(224, 168, 64, 0.35);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap');
  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{ min-height: 100%; font-family: var(--font-body); color: var(--text-main); }
  .bg-photo{
    position: fixed;
    inset: 0;
    z-index: -2;
    background-image: url('https://d209nv3nexrgbg.cloudfront.net/media/users_app/background_imgs/WhatsApp_Image_2022-05-12_at_12.jpg');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
  }
  @media (min-width: 720px){
    .bg-photo{
      background-position: center 30%;
    }
  }
  .bg-overlay{ position: fixed; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(6,8,7,0.55) 0%, rgba(6,8,7,0.35) 28%, rgba(6,8,7,0.55) 62%, rgba(6,8,7,0.88) 100%); }
  .page{ min-height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; padding: 64px 20px 48px; }
  .profile-pic{ width: 108px; height: 108px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,0.85); box-shadow: 0 8px 30px rgba(0,0,0,0.45); animation: rise 0.7s ease-out both; }
  .display-name{ font-family: var(--font-display); font-weight: 700; font-size: clamp(1.5rem, 4vw, 2rem); text-align: center; letter-spacing: 0.01em; }
  .tagline{ font-size: 0.95rem; color: var(--text-soft); margin-top: 6px; text-align: center; max-width: 420px; animation: rise 0.7s ease-out 0.14s both; }
  .social-row{ display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 22px; max-width: 320px; animation: rise 0.7s ease-out 0.2s both; }
  .social-link{ width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(8px); color: var(--text-main); text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease; }
  .social-link svg{ width: 19px; height: 19px; fill: currentColor; }
  .social-link:hover, .social-link:focus-visible{ transform: translateY(-3px); background: var(--accent-soft); border-color: var(--accent); }
  .social-link:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }
  .card-list{ width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; margin-top: 36px; }
  .link-card{ position: relative; display: flex; align-items: center; gap: 14px; padding: 12px 18px 12px 12px; border-radius: 18px; background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(10px); text-decoration: none; color: var(--text-main); overflow: hidden; animation: rise 0.6s ease-out both, float 5s ease-in-out 0.6s infinite; transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease; }
  .link-card:hover, .link-card:focus-visible{ transform: translateY(-4px) scale(1.01); border-color: var(--accent); background: rgba(20, 26, 22, 0.96); box-shadow: 0 10px 26px rgba(0,0,0,0.35); }
  .link-card:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }
  .link-thumb{ width: 52px; height: 52px; border-radius: 12px; object-fit: cover; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.35); }
  .link-title{ flex: 1; text-align: center; font-weight: 600; font-size: 0.98rem; padding-right: 52px; }
  @keyframes rise{ from{ opacity: 0; transform: translateY(14px); } to{ opacity: 1; transform: translateY(0); } }
  @keyframes float{ 0%, 100%{ transform: translateY(0); } 50%{ transform: translateY(-5px); } }
  @media (prefers-reduced-motion: reduce){ *{ animation: none !important; transition: none !important; } }
  footer{ margin-top: 40px; font-size: 0.75rem; color: var(--text-soft); text-align: center; }
  .title-row{ display: flex; align-items: center; gap: 8px; margin-top: 18px; animation: rise 0.7s ease-out 0.08s both; }
  .icon-btn{ display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%; background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(8px); color: var(--text-main); cursor: pointer; padding: 0; transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease; }
  .icon-btn svg{ width: 15px; height: 15px; }
  .icon-btn:hover, .icon-btn:focus-visible{ transform: translateY(-2px); background: var(--accent-soft); border-color: var(--accent); }
  .copy-toast{ display: block; min-height: 1.1em; margin-top: 8px; font-size: 0.78rem; color: var(--accent); text-align: center; animation: rise 0.7s ease-out 0.22s both; }
</style>
</head>
<body>
<div class="bg-photo"></div>
<div class="bg-overlay"></div>
<main class="page">
  <img class="profile-pic" src="https://images.unsplash.com/photo-1502685104226-ee32379fefbe?q=80&w=300&auto=format&fit=crop" alt="Foto de perfil">
  <div class="title-row">
    <h1 class="display-name">Primero</h1>
    <button class="icon-btn" id="actionBtn" type="button" aria-label="Compartir o copiar enlace de esta página">
      <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.6 15.8 6.4M8.3 13.4l7.5 4.2" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>
  <p class="tagline">avion que no dejas dormir</p>
  <span class="copy-toast" id="copyToast" aria-live="polite"></span>
  <nav class="social-row" aria-label="Redes sociales">
    <a href="instagram" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="instagram"><svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.85.07 1.25.06 2.1.25 2.85.55.77.3 1.42.7 2.07 1.35.65.65 1.05 1.3 1.35 2.07.3.75.49 1.6.55 2.85.06 1.25.07 1.65.07 4.85s0 3.6-.07 4.85c-.06 1.25-.25 2.1-.55 2.85a5.8 5.8 0 0 1-1.35 2.07 5.8 5.8 0 0 1-2.07 1.35c-.75.3-1.6.49-2.85.55-1.25.06-1.65.07-4.85.07s-3.6 0-4.85-.07c-1.25-.06-2.1-.25-2.85-.55a5.8 5.8 0 0 1-2.07-1.35 5.8 5.8 0 0 1-1.35-2.07c-.3-.75-.49-1.6-.55-2.85C2.2 15.6 2.2 15.2 2.2 12s0-3.6.07-4.85c.06-1.25.25-2.1.55-2.85a5.8 5.8 0 0 1 1.35-2.07A5.8 5.8 0 0 1 6.24 .88c.75-.3 1.6-.49 2.85-.55C10.34 2.2 10.74 2.2 12 2.2zm0 3a6.8 6.8 0 1 0 0 13.6 6.8 6.8 0 0 0 0-13.6zm0 2a4.8 4.8 0 1 1 0 9.6 4.8 4.8 0 0 1 0-9.6zm6.9-2.2a1.16 1.16 0 1 1-2.32 0 1.16 1.16 0 0 1 2.32 0z"/></svg></a>
    <a href="facebook" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="facebook"><svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg></a>
  </nav>
  <section class="card-list" aria-label="Enlaces">
    <a href="https://example.com/catalogo" class="link-card" target="_blank" rel="noopener noreferrer" style="animation-delay:0s, 0.6s; animation-duration:0.6s, 4.5s;">
      <img class="link-thumb" src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=200&auto=format&fit=crop" alt="">
      <span class="link-title">Catálogo de productos</span>
    </a>
    <a href="https://example.com/reservas" class="link-card" target="_blank" rel="noopener noreferrer" style="animation-delay:0.1s, 1s; animation-duration:0.6s, 5.1s;">
      <img class="link-thumb" src="https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?q=80&w=200&auto=format&fit=crop" alt="">
      <span class="link-title">Reservas</span>
    </a>
  </section>
  <footer>hecho con 🤎</footer>
</main>
<script>
  var PUBLIC_URL = "https://daneirostro.github.io/liobink/";
  var actionBtn = document.getElementById('actionBtn');
  var toast = document.getElementById('copyToast');
  var pageUrl = PUBLIC_URL || window.location.href;
  var isTouchDevice = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  var canShare = !!navigator.share && window.location.protocol !== 'file:' && isTouchDevice;

  actionBtn.setAttribute('aria-label', canShare ? 'Compartir esta página' : 'Copiar enlace de esta página');

  function showToast(msg){
    toast.textContent = msg;
    setTimeout(function(){ toast.textContent = ''; }, 2500);
  }

  function copyLink(){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(pageUrl).then(function(){
        showToast('Enlace copiado ✅');
      }).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
  }

  function fallbackCopy(){
    var temp = document.createElement('textarea');
    temp.value = pageUrl;
    temp.style.position = 'fixed';
    temp.style.top = '0';
    temp.style.left = '0';
    temp.style.width = '1px';
    temp.style.height = '1px';
    temp.style.opacity = '0';
    document.body.appendChild(temp);
    temp.focus();
    temp.select();
    try{
      document.execCommand('copy');
      showToast('Enlace copiado ✅');
    }catch(err){
      showToast('No se pudo copiar automáticamente');
    }
    document.body.removeChild(temp);
  }

  actionBtn.addEventListener('click', function(){
    if (canShare){
      navigator.share({ title: document.title, url: pageUrl }).catch(function(err){
        // Si el usuario simplemente cerró el panel, no hacer nada.
        // Si falló por otra razón, usar copiar como respaldo.
        if (!err || err.name !== 'AbortError') copyLink();
      });
    } else {
      copyLink();
    }
  });
</script>
</body>
</html>
