<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Código insertado</title>
<style>
  :root{
    --glass: rgba(20, 26, 22, 0.22);
    --glass-border: rgba(255, 255, 255, 0.14);
    --text-main: #f5f2ea;
    --text-soft: rgba(245, 242, 234, 0.72);
    --accent: #e0a840;
    --accent-soft: rgba(224, 168, 64, 0.35);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap');
  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{ min-height: 100%; font-family: var(--font-body); color: var(--text-main); background: #0e1410; }
  .hero-photo{
    width: 100%;
    height: 42vh;
    background-image: url('https://images.unsplash.com/photo-1500534623283-312aade485b7?q=80&w=1600&auto=format&fit=crop');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center top;
  }
  @media (min-width: 720px){
    .hero-photo{
      height: 46vh;
      background-position: center 30%;
    }
  }
  .page{ min-height: 60vh; width: 100%; display: flex; flex-direction: column; align-items: center; padding: 0 20px 48px; }
  .profile-pic{ width: 108px; height: 108px; margin-top: -54px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,0.85); box-shadow: 0 8px 30px rgba(0,0,0,0.45); animation: rise 0.7s ease-out both; }
  .display-name{ font-family: var(--font-display); font-weight: 700; font-size: clamp(1.5rem, 4vw, 2rem); text-align: center; letter-spacing: 0.01em; }
  .tagline{ font-size: 0.95rem; color: var(--text-soft); margin-top: 6px; text-align: center; max-width: 420px; animation: rise 0.7s ease-out 0.14s both; }
  .social-row{ display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 22px; max-width: 320px; animation: rise 0.7s ease-out 0.2s both; }
  .social-link{ width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(8px); color: var(--text-main); text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease; }
  .social-link svg{ width: 19px; height: 19px; fill: currentColor; }
  .social-link:hover, .social-link:focus-visible{ transform: translateY(-3px); background: var(--accent-soft); border-color: var(--accent); }
  .social-link:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }
  .card-list{ width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; margin-top: 36px; }
  .link-card{ position: relative; display: flex; align-items: center; gap: 14px; padding: 12px 18px 12px 12px; border-radius: 18px; background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(4px); text-decoration: none; color: var(--text-main); overflow: hidden; animation: rise 0.6s ease-out both, float 5s ease-in-out 0.6s infinite; transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease; }
  .link-card:hover, .link-card:focus-visible{ transform: translateY(-4px) scale(1.01); border-color: var(--accent); background: rgba(20, 26, 22, 0.96); box-shadow: 0 10px 26px rgba(0,0,0,0.35); }
  .link-card:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }
  .link-thumb{ width: 52px; height: 52px; border-radius: 12px; object-fit: cover; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.35); }
  .link-title{ flex: 1; text-align: center; font-weight: 600; font-size: 0.98rem; padding-right: 52px; }
  .embeds-section{ width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 36px; }
  .embeds-section iframe{ max-width: 100%; border-radius: 14px; border: none; }
  .embeds-section blockquote{ margin: 0; max-width: 100% !important; width: 100% !important; }
  @keyframes rise{ from{ opacity: 0; transform: translateY(14px); } to{ opacity: 1; transform: translateY(0); } }
  @keyframes float{ 0%, 100%{ transform: translateY(0); } 50%{ transform: translateY(-5px); } }
  @media (prefers-reduced-motion: reduce){ *{ animation: none !important; transition: none !important; } }
  footer{ margin-top: 40px; font-size: 0.75rem; color: var(--text-soft); text-align: center; }
  .title-row{ display: flex; align-items: center; gap: 8px; margin-top: 18px; animation: rise 0.7s ease-out 0.08s both; }
  .icon-btn{ display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%; background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(8px); color: var(--text-main); cursor: pointer; padding: 0; transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease; }
  .icon-btn svg{ width: 15px; height: 15px; }
  .icon-btn:hover, .icon-btn:focus-visible{ transform: translateY(-2px); background: var(--accent-soft); border-color: var(--accent); }
  .copy-toast{ display: block; min-height: 1.1em; margin-top: 8px; font-size: 0.78rem; color: var(--accent); text-align: center; animation: rise 0.7s ease-out 0.22s both; }
</style>
</head>

<script>
  var PUBLIC_URL = "https://ayudaenlacompu.wixsite.com/dulcearoma";
  var actionBtn = document.getElementById('actionBtn');
  var toast = document.getElementById('copyToast');
  var pageUrl = PUBLIC_URL || window.location.href;
  var isTouchDevice = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  var canShare = !!navigator.share && window.location.protocol !== 'file:' && isTouchDevice;

  actionBtn.setAttribute('aria-label', canShare ? 'Compartir esta página' : 'Copiar enlace de esta página');

  function showToast(msg){
    toast.textContent = msg;
    setTimeout(function(){ toast.textContent = ''; }, 2500);
  }

  function copyLink(){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(pageUrl).then(function(){
        showToast('Enlace copiado ✅');
      }).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
  }

  function fallbackCopy(){
    var temp = document.createElement('textarea');
    temp.value = pageUrl;
    temp.style.position = 'fixed';
    temp.style.top = '0';
    temp.style.left = '0';
    temp.style.width = '1px';
    temp.style.height = '1px';
    temp.style.opacity = '0';
    document.body.appendChild(temp);
    temp.focus();
    temp.select();
    try{
      document.execCommand('copy');
      showToast('Enlace copiado ✅');
    }catch(err){
      showToast('No se pudo copiar automáticamente');
    }
    document.body.removeChild(temp);
  }

  actionBtn.addEventListener('click', function(){
    if (canShare){
      navigator.share({ title: document.title, url: pageUrl }).catch(function(err){
        // Si el usuario simplemente cerró el panel, no hacer nada.
        // Si falló por otra razón, usar copiar como respaldo.
        if (!err || err.name !== 'AbortError') copyLink();
      });
    } else {
      copyLink();
    }
  });
</script>
