<title>amenazante</title>
<style>
  :root{
    --fondo: #150a21;
    --texto: #f5f2ea;
    --texto-suave: rgba(245,242,234,0.72);
    --acento: #a855f7;
    --acento-texto: #ffffff;
    --fuente-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --glass: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.14);
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap');
  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{ min-height: 100%; font-family: var(--font-body); color: var(--texto); background: var(--fondo); }

  .hero-photo--completa{ width: 100%; height: 42vh; background-size: cover; background-repeat: no-repeat; background-position: center; }
  @media (min-width: 720px){ .hero-photo--completa{ height: 46vh; background-position: center 30%; } }

  .hero-photo--enmarcada{ width: calc(100% - 40px); max-width: 480px; height: 220px; object-fit: cover; border-radius: 20px; margin: 24px auto 0; display: block; }

  .page{ min-height: 60vh; width: 100%; display: flex; flex-direction: column; align-items: center; padding: 0 20px 48px; }
  .profile-pic{ width: 108px; height: 108px; margin-top: -54px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,0.85); box-shadow: 0 8px 30px rgba(0,0,0,0.45); }
  .display-name{ font-family: var(--fuente-display); font-weight: 700; font-size: clamp(1.5rem, 4vw, 2rem); text-align: center; margin-top: 10px; }
  .tagline{ font-size: 0.95rem; color: var(--texto-suave); margin-top: 6px; text-align: center; max-width: 420px; }
  .social-row{ display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 22px; max-width: 320px; }
  .social-link{ width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--glass); border: 1px solid var(--glass-border); text-decoration: none; transition: transform 0.25s ease; }
  .social-link img{ width: 24px; height: 24px; }
  .social-link:hover{ transform: translateY(-3px); }

  .card-list{ width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; margin-top: 36px; }
  .link-card{ display: flex; align-items: center; gap: 14px; padding: 12px 18px 12px 12px; border-radius: 18px; background: var(--glass); border: 1px solid var(--glass-border); text-decoration: none; color: var(--texto); transition: transform 0.25s ease; }
  .link-card:hover{ transform: translateY(-4px); border-color: var(--acento); }
  .link-card--pildora{ border-radius: 999px; padding: 10px 22px; }
  .link-thumb{ width: 52px; height: 52px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
  .link-card--pildora .link-thumb{ width: 36px; height: 36px; border-radius: 50%; }
  .link-title{ flex: 1; text-align: center; font-weight: 600; font-size: 0.98rem; }

  .embeds-section{ width: 100%; max-width: 480px; margin-top: 36px; display: flex; flex-direction: column; gap: 24px; }
  .contact-btn{ display: inline-flex; align-items: center; gap: 10px; margin-top: 36px; padding: 15px 32px; border-radius: 999px; background: var(--acento); color: var(--acento-texto); text-decoration: none; font-weight: 700; }
  .contact-btn img{ width: 22px; height: 22px; }
  footer{ margin-top: 40px; font-size: 0.75rem; color: var(--texto-suave); text-align: center; }
</style>

  <p class="tagline"></p>
  <nav class="social-row" aria-label="Redes sociales">

  </nav>
  <section class="card-list" aria-label="Enlaces">

  </section>

</main>
</body>
