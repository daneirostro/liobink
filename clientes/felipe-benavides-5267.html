<script>
(function () {
  var meta = document.querySelector('meta[name="build"]');
  if (!meta) return;
  var actual = meta.getAttribute('content');
  var recienPublicada = (Date.now() - Number(actual)) < 5 * 60 * 1000;
  var intentos = 0;

  function revisar() {
    intentos++;
    fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (html) {
        var m = html.match(/name="build" content="([0-9]+)"/);
        if (m && m[1] !== actual) { location.reload(); return; }
        if (recienPublicada && intentos < 30) setTimeout(revisar, 10000);
      })
      .catch(function () {});
  }

  revisar();
})();
</script>
<script>
(function () {
  var btn = document.getElementById('share-btn');
  var toast = document.getElementById('share-toast');
  if (!btn) return;

  function aviso(texto) {
    toast.textContent = texto;
    toast.classList.add('visible');
    setTimeout(function () { toast.classList.remove('visible'); }, 2500);
  }

  btn.addEventListener('click', function () {
    var url = location.href.split('?')[0];
    if (navigator.share) {
      navigator.share({ title: document.title, url: url }).catch(function () {});
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(
        function () { aviso('¡Enlace copiado!'); },
        function () { window.prompt('Copia este enlace:', url); }
      );
    } else {
      window.prompt('Copia este enlace:', url);
    }
  });
})();
</script>
