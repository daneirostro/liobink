<style>
  :root{
    --fondo: #150a21;
    --texto: #f5f2ea;
    --texto-suave: rgba(245,242,234,0.72);
    --acento: #a855f7;
    --acento-texto: #ffffff;
    --fuente-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --glass: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.14);
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap');
  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{ min-height: 100%; font-family: var(--font-body); color: var(--texto); background: var(--fondo); }

  .hero-photo--completa{ display: block; width: 100%; height: auto; max-height: 60vh; object-fit: cover; }
  @media (min-width: 720px){ .hero-photo--completa{ height: 60vh; max-height: none; object-fit: cover; object-position: center 30%; } }

  .hero-photo--enmarcada{ width: calc(100% - 40px); max-width: 480px; height: 220px; object-fit: cover; border-radius: 20px; margin: 24px auto 0; display: block; }
  @media (min-width: 720px){ .hero-photo--enmarcada{ height: 280px; } }

  .page{ min-height: 60vh; width: 100%; display: flex; flex-direction: column; align-items: center; padding: 0 20px 48px; }
  .profile-pic{ width: 108px; height: 108px; margin-top: -54px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,0.85); box-shadow: 0 8px 30px rgba(0,0,0,0.45); }
  .display-name{ font-family: var(--fuente-display); font-weight: 700; font-size: clamp(1.5rem, 4vw, 2rem); text-align: center; margin-top: 10px; }
  .tagline{ font-size: 0.95rem; color: var(--texto-suave); margin-top: 6px; text-align: center; max-width: 420px; }
  .social-row{ display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 22px; max-width: 320px; }
  .social-link{ width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--glass); border: 1px solid var(--glass-border); text-decoration: none; transition: transform 0.25s ease; }
  .social-link img{ width: 24px; height: 24px; }
  .social-link:hover{ transform: translateY(-3px); }

  .card-list{ width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; margin-top: 36px; }
  .link-card{ position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 84px; padding: 14px 22px; border-radius: 18px; background: var(--glass); border: 1px solid var(--glass-border); text-decoration: none; color: #fff; transition: transform 0.25s ease; }
  .link-card::after{ content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,0.30), rgba(0,0,0,0.45)); z-index: 1; pointer-events: none; }
  .link-card:hover{ transform: translateY(-4px); border-color: var(--acento); }
  .link-card--pildora{ border-radius: 999px; min-height: 64px; padding: 10px 28px; }
  .link-thumb{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  .link-title{ position: relative; z-index: 2; flex: 1; text-align: center; font-weight: 700; font-size: 1rem; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }

  .embeds-section{ width: 100%; max-width: 480px; margin-top: 36px; display: flex; flex-direction: column; gap: 24px; }
  .embeds-section > *{ min-width: 0; max-width: 100%; }
  .embeds-section iframe, .embeds-section blockquote{ max-width: 100%; }
  .embeds-section iframe[src*="youtube"]{ width: 100%; height: auto; aspect-ratio: 16 / 9; border: 0; display: block; }
  .contact-btn{ display: inline-flex; align-items: center; gap: 10px; margin-top: 36px; padding: 15px 32px; border-radius: 999px; background: var(--acento); color: var(--acento-texto); text-decoration: none; font-weight: 700; }
  .contact-btn img{ width: 22px; height: 22px; }
  footer{ margin-top: 40px; font-size: 0.75rem; color: var(--texto-suave); text-align: center; }
  .title-row{ display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; max-width: 100%; }
  .title-row .display-name{ margin-top: 0; }
  .share-btn{ flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--glass); border: 1px solid var(--glass-border); color: var(--texto); cursor: pointer; transition: transform 0.25s ease; }
  .share-btn:hover{ transform: translateY(-2px); border-color: var(--acento); }
  .share-btn svg{ width: 18px; height: 18px; }
  .share-toast{ position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 20; padding: 8px 16px; border-radius: 999px; background: rgba(0,0,0,0.78); color: #fff; font-size: 0.85rem; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
  .share-toast.visible{ opacity: 1; }

  <p class="tagline">cdvdf gfg fgfgb fg</p>

  </nav>

    <footer>hecho con 🤎</footer>
</main>
<script>
(function () {
  var meta = document.querySelector('meta[name="build"]');
  if (!meta) return;
  var actual = meta.getAttribute('content');
  var recienPublicada = (Date.now() - Number(actual)) < 5 * 60 * 1000;
  var intentos = 0;

  function revisar() {
    intentos++;
    fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (html) {
        var m = html.match(/name="build" content="([0-9]+)"/);
        if (m && m[1] !== actual) { location.reload(); return; }
        if (recienPublicada && intentos < 30) setTimeout(revisar, 10000);
      })
      .catch(function () {});
  }

  revisar();
})();
</script>
<script>
(function () {
  var btn = document.getElementById('share-btn');
  var toast = document.getElementById('share-toast');
  if (!btn) return;

  function aviso(texto) {
    toast.textContent = texto;
    toast.classList.add('visible');
    setTimeout(function () { toast.classList.remove('visible'); }, 2500);
  }

  btn.addEventListener('click', function () {
    var url = location.href.split('?')[0];
    if (navigator.share) {
      navigator.share({ title: document.title, url: url }).catch(function () {});
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(
        function () { aviso('¡Enlace copiado!'); },
        function () { window.prompt('Copia este enlace:', url); }
      );
    } else {
      window.prompt('Copia este enlace:', url);
    }
  });
})();
</script>
