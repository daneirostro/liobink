<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu página se está publicando...</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; font-family: system-ui, sans-serif; background: #150a21; color: #f5f2ea; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  h1 { font-size: 1.3rem; margin-bottom: 8px; }
  p { color: rgba(245,242,234,0.7); font-size: 0.95rem; }
  .spinner { width: 28px; height: 28px; border: 3px solid rgba(245,242,234,0.3); border-top-color: #f5f2ea; border-radius: 50%; animation: girar 1s linear infinite; margin: 0 auto 16px; }
  @keyframes girar { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <h1>Tu página se está publicando</h1>
    <p>Esto puede tardar uno o dos minutos. Esta página se actualizará sola, no hace falta que hagas nada.</p>
  </div>
  <script>
    var intentos = 0;
    var maxIntentos = 30; // 30 x 5s = 2.5 minutos

    function intentarDeNuevo() {
      intentos++;
      if (intentos > maxIntentos) {
        document.querySelector('p').textContent = 'Esto está tardando más de lo normal. Intenta recargar en unos minutos.';
        document.querySelector('.spinner').style.display = 'none';
        return;
      }
      fetch(window.location.href, { cache: 'no-store' })
        .then(function (res) {
          if (res.ok) {
            window.location.reload();
          } else {
            setTimeout(intentarDeNuevo, 5000);
          }
        })
        .catch(function () {
          setTimeout(intentarDeNuevo, 5000);
        });
    }

    setTimeout(intentarDeNuevo, 5000);
  </script>
</body>
</html>
